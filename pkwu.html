const letters = ["A","B","C","D","E"];

function renderQuiz(){

  const quiz = document.getElementById("quiz");

  questions.forEach((q,index)=>{

    const card = document.createElement("div");
    card.className = "card";
    card.id = "q" + index;

    let options = "";

    q[1].forEach((option,optIndex)=>{

      options += `
        <label class="option">
          <input
            type="radio"
            name="q${index}"
            value="${optIndex}"
            onchange="updateProgress()"
          >
          <span class="letter">${letters[optIndex]}.</span>
          <span>${option}</span>
        </label>
      `;

    });

    card.innerHTML = `
      <div class="question">
        ${index+1}. ${q[0]}
      </div>

      <div class="options">
        ${options}
      </div>

      <div class="answer-info"></div>

      <div class="explanation">
        <strong>Pembahasan:</strong><br>
        ${q[3]}
      </div>
    `;

    quiz.appendChild(card);

  });

}

function updateProgress(){

  let answered = 0;

  questions.forEach((q,index)=>{
    const selected = document.querySelector(
      `input[name="q${index}"]:checked`
    );

    if(selected) answered++;
  });

  document.getElementById("progressText").textContent =
    answered + " / " + questions.length;

  document.getElementById("progressBar").style.width =
    (answered / questions.length * 100) + "%";
}

function finishQuiz(){

  let score = 0;
  let answered = 0;

  questions.forEach((q,index)=>{

    const card = document.getElementById("q"+index);

    const selected = document.querySelector(
      `input[name="q${index}"]:checked`
    );

    card.classList.remove("correct","wrong");
    card.classList.add("checked");

    if(selected){

      answered++;

      const answer = Number(selected.value);

      if(answer === q[2]){

        score++;

        card.classList.add("correct");

        card.querySelector(".answer-info").innerHTML =
          `<span class="correct-text">✓ Jawaban kamu benar.</span>`;

      }else{

        card.classList.add("wrong");

        card.querySelector(".answer-info").innerHTML =
          `<span class="wrong-text">✗ Jawaban kamu salah.</span>
           <br>Jawaban benar:
           <strong>${letters[q[2]}. ${q[1][q[2]]}</strong>`;

      }

    }else{

      card.classList.add("wrong");

      card.querySelector(".answer-info").innerHTML =
        `<span class="wrong-text">✗ Belum dijawab.</span>
         <br>Jawaban benar:
         <strong>${letters[q[2]}. ${q[1][q[2]]}</strong>`;

    }

  });

  const nilai = Math.round((score / questions.length) * 100);

  document.getElementById("score").textContent =
    nilai;

  document.getElementById("summary").textContent =
    `Benar ${score} dari ${questions.length} soal • Dijawab ${answered} soal`;

  let grade = "";

  if(nilai >= 90){
    grade = "Sangat baik! Pemahaman materi kamu sangat kuat.";
  }else if(nilai >= 80){
    grade = "Baik! Pemahaman materi kamu sudah bagus.";
  }else if(nilai >= 70){
    grade = "Cukup baik. Masih ada beberapa konsep yang perlu dipelajari.";
  }else if(nilai >= 60){
    grade = "Perlu latihan lagi, terutama pada soal analisis kasus.";
  }else{
    grade = "Pelajari kembali materi kemudian coba ulangi latihan.";
  }

  document.getElementById("grade").textContent = grade;

  document.getElementById("result").style.display = "block";

  document.getElementById("result").scrollIntoView({
    behavior:"smooth"
  });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

renderQuiz();
updateProgress();
