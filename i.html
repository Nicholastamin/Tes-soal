function renderQuiz() {
    const container = document.getElementById('quiz-container');
    quizData.forEach((item, index) => {
        if (item.section) {
            const secHeader = document.createElement('div');
            secHeader.className = 'section-header';
            secHeader.innerText = item.section;
            container.appendChild(secHeader);
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        qTitle.innerText = item.q;
        card.appendChild(qTitle);

        const optionsGroup = document.createElement('div');
        optionsGroup.className = 'options-group';

        item.options.forEach((opt, optIndex) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${index}`;
            radio.value = optIndex;

            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt));
            optionsGroup.appendChild(label);
        });

        card.appendChild(optionsGroup);

        const expBox = document.createElement('div');
        expBox.className = 'explanation';
        expBox.id = `exp-${index}`;
        expBox.innerHTML = `<strong>Pembahasan:</strong> ${item.exp}`;
        card.appendChild(expBox);

        container.appendChild(card);
    });
}

function calculateScore() {
    let score = 0;
    let correctCount = 0;

    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const card = document.getElementById(`q-card-${index}`);
        const expBox = document.getElementById(`exp-${index}`);
        
        card.classList.remove('correct', 'incorrect');
        expBox.style.display = 'block';

        if (selected) {
            const selectedVal = parseInt(selected.value);
            if (selectedVal === item.answer) {
                score += 2; // 50 soal * 2 = 100
                correctCount++;
                card.classList.add('correct');
            } else {
                card.classList.add('incorrect');
            }
        } else {
            card.classList.add('incorrect');
        }
    });

    const resultBox = document.getElementById('result-box');
    const scoreDisplay = document.getElementById('score-display');
    const scoreDetails = document.getElementById('score-details');

    scoreDisplay.innerText = `${score} / 100`;
    scoreDetails.innerText = `Anda berhasil menjawab benar ${correctCount} dari 50 soal.`;
    resultBox.style.display = 'block';

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
    });
}

window.onload = renderQuiz;
</script>
